name: Suspectround
packages:
  Alamofire:
    url: https://github.com/otazugudy274-ai/Alamofire
    revision: 9799237b84cbd97f80a3ac9b69b30ba65139f752
options:
  bundleIdPrefix: com.suspectround
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Suspectround:
    type: application
    platform: iOS
    sources:
      - path: Suspectround
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suspectround.hunt
        PRODUCT_NAME: Suspectround
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: ChickCurio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: "Suspectround scans barcodes to name the active suspect and meal intakes without logging calories."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  SuspectroundTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SuspectroundTests
    dependencies:
      - target: Suspectround
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suspectround.hunt.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Suspectround.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Suspectround"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Suspectround:
    build:
      targets:
        Suspectround: all
        SuspectroundTests: [test]
    test:
      targets:
        - SuspectroundTests
